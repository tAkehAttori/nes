<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Nes</title>
    <style>
        body {
            background-color: #080000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .nes-text {
            color: #ffffff;
            font-family: 'Arial Black', sans-serif;
            font-size: 3.5rem; 
            letter-spacing: 0.5rem;
            text-transform: uppercase;
            text-align: center; 
            line-height: 1.5;   
        }

        .char {
            display: inline-block;
            opacity: 0;
            transform: translateX(50px);
            animation: move-in 1.5s ease-out forwards; 
        }

        @keyframes move-in {
            to {
                opacity: 1;
                transform: translateX(0);
                filter: blur(0);
            }
        }

        .bottom-right {
            position: fixed;
            bottom: 230px;   
            right: 30px;    
            width: 200px;   
            height: auto;
        }
    </style>
</head>
<body>

    <img src="NESロゴ_白.png" class="bottom-right">

        <h1 class="nes-text" id="target">株式会社 NES<br>
                                        MOLDING YOUR<br> 
                                        IDEAL INTO THE FORM</h1>

    <script>
        const target = document.getElementById('target');
        const text = target.innerText;
        target.innerHTML = '';

        text.split('').forEach((char, index) => {
            if (char === '\n') {
                const br = document.createElement('br');
                target.appendChild(br);
            } else {
                const span = document.createElement('span');
                span.textContent = char === '\n ' ? '\u00A0' : char;
                span.classList.add('char');
                span.style.animationDelay = `${index * 0.3}s`;   
                target.appendChild(span);
            }
        });
    </script>

</body>
</html>
